services:
  - type: web
    name: choice-agent-v2
    runtime: python
    plan: free
    buildCommand: >-
      python -m pip install --upgrade pip &&
      if [ -f requirements.txt ]; then
        python -m pip install -r requirements.txt;
      elif [ -f pyproject.toml ]; then
        python -m pip install .;
      else
        echo "No requirements.txt or pyproject.toml found" >&2;
        exit 1;
      fi
    startCommand: PYTHONPATH=src python -m uvicorn choice_agent.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.6
      - key: PYTHONUNBUFFERED
        value: "1"