<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Choice Agent · 通用决策</title>
    <link rel="stylesheet" href="./assets/css/app.css">
</head>
<body>
<script>
    (() => {
        try {
            const theme = localStorage.getItem("choiceAgentTheme");
            document.body.dataset.theme = theme === "pop" ? "pop" : "mint";
        } catch (error) {
            document.body.dataset.theme = "mint";
        }
    })();
</script>
<div class="app-shell">
    <header class="topbar">
        <a class="brand" href="#/" aria-label="回到 Choice Agent 首页">
            <span class="brand-mark">C</span>
            <span>
                    <strong>Choice Agent</strong>
                    <small>把选择想清楚</small>
                </span>
        </a>
        <nav class="nav-links" aria-label="主导航">
            <a href="#/" data-nav="/">首页</a>
            <a href="#/history" data-nav="/history">历史决策</a>
            <a href="#/profile" data-nav="/profile">我的资料</a>
        </nav>
        <div class="topbar-actions">
            <div id="developerMenu" class="theme-menu developer-menu">
                <button id="developerMenuButton" class="theme-menu-button" type="button" data-action="toggle-developer-menu" aria-label="开发者工具" aria-haspopup="menu" aria-expanded="false">
                    <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                        <path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.09a2 2 0 0 1 1 1.73v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.38a2 2 0 0 0-.73-2.73l-.15-.09a2 2 0 0 1-1-1.74v-.51a2 2 0 0 1 1-1.73l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2Z" />
                        <circle cx="12" cy="12" r="3" />
                    </svg>
                </button>
                <div class="theme-menu-list developer-menu-list hidden" role="menu" aria-label="开发者工具">
                    <label class="developer-toggle" role="menuitemcheckbox">
                        <input type="checkbox" data-action="toggle-developer-mode">
                        <span>Developer Mode</span>
                    </label>
                    <a href="#/admin/traces" role="menuitem">Trace</a>
                    <a href="#/admin/evaluations" role="menuitem">Evaluation</a>
                    <a href="#/settings" role="menuitem">API / Model 设置</a>
                    <a href="#/developer/debug" role="menuitem">Debug 信息</a>
                    <label class="user-field developer-user-field">
                        <span>用户 ID</span>
                        <input id="userIdInput" type="number" min="1" value="1">
                    </label>
                </div>
            </div>
            <div id="themeMenu" class="theme-menu">
                <button id="themeMenuButton" class="theme-menu-button" type="button" data-action="toggle-theme-menu" aria-label="选择界面皮肤" aria-haspopup="menu" aria-expanded="false">
                    <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                        <path d="M8.5 4 10 6h4l1.5-2 4 2.4-2.2 4.1V20H6.7v-9.5L4.5 6.4 8.5 4Z" />
                    </svg>
                </button>
                <div class="theme-menu-list hidden" role="menu" aria-label="选择界面皮肤">
                    <button type="button" role="menuitemradio" data-action="set-theme" data-theme-value="mint" aria-label="清新绿" aria-checked="true"><span class="theme-swatch mint"></span></button>
                    <button type="button" role="menuitemradio" data-action="set-theme" data-theme-value="pop" aria-label="活力橙" aria-checked="false"><span class="theme-swatch pop"></span></button>
                </div>
            </div>
        </div>
    </header>

    <main id="app" class="page" tabindex="-1"></main>
</div>

<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script src="./assets/js/api.js"></script>
<script src="./assets/js/demo.js"></script>
<script src="./assets/js/evidence.js"></script>
<script src="./assets/js/conversation.js"></script>
<script src="./assets/js/trace.js"></script>
<script src="./assets/js/evaluation.js"></script>
<script src="./assets/js/app.js"></script>
<script src="./assets/js/trace-entry.js"></script>
</body>
</html>
