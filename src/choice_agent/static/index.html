<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Choice Agent V2 · 通用决策</title>
    <link rel="stylesheet" href="./assets/css/app.css">
</head>
<body>
<script>
    (() => {
        try {
            const theme = localStorage.getItem("choiceAgentTheme");
            document.body.dataset.theme = theme === "pop" ? "pop" : "mint";
        } catch (error) {
            document.body.dataset.theme = "mint";
        }
    })();
</script>
<div class="app-shell">
    <header class="topbar">
        <a class="brand" href="#/" aria-label="回到 Choice Agent 首页">
            <span class="brand-mark">C</span>
            <span>
                    <strong>Choice Agent V2</strong>
                    <small>通用多 Agent 决策</small>
                </span>
        </a>
        <nav class="nav-links" aria-label="主导航">
            <a href="#/" data-nav="/">首页</a>
            <a href="#/diet/meals/personal" data-nav="/data">我的数据</a>
            <a href="#/admin/traces" data-nav="/admin/traces">Trace</a>
            <a href="#/admin/evaluations" data-nav="/admin/evaluations">评估</a>
            <a href="#/settings" data-nav="/settings">设置</a>
        </nav>
        <div class="topbar-actions">
            <div id="themeMenu" class="theme-menu">
                <button id="themeMenuButton" class="theme-menu-button" type="button" data-action="toggle-theme-menu" aria-label="选择界面皮肤" aria-haspopup="menu" aria-expanded="false">
                    <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                        <path d="M8.5 4 10 6h4l1.5-2 4 2.4-2.2 4.1V20H6.7v-9.5L4.5 6.4 8.5 4Z" />
                    </svg>
                </button>
                <div class="theme-menu-list hidden" role="menu" aria-label="选择界面皮肤">
                    <button type="button" role="menuitemradio" data-action="set-theme" data-theme-value="mint" aria-label="清新绿" aria-checked="true"><span class="theme-swatch mint"></span></button>
                    <button type="button" role="menuitemradio" data-action="set-theme" data-theme-value="pop" aria-label="活力橙" aria-checked="false"><span class="theme-swatch pop"></span></button>
                </div>
            </div>
            <label class="user-field">
                <span>用户 ID</span>
                <input id="userIdInput" type="number" min="1" value="1">
            </label>
        </div>
    </header>

    <main id="app" class="page" tabindex="-1"></main>
</div>

<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script src="./assets/js/api.js"></script>
<script src="./assets/js/demo.js"></script>
<script src="./assets/js/app.js"></script>
</body>
</html>
