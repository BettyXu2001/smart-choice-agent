<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Choice Agent V2 · 通用决策</title>
    <link rel="stylesheet" href="./assets/css/app.css">
</head>
<body>
<script>
    (() => {
        try {
            const theme = localStorage.getItem("choiceAgentTheme");
            document.body.dataset.theme = theme === "pop" ? "pop" : "mint";
        } catch (error) {
            document.body.dataset.theme = "mint";
        }
    })();
</script>
<div class="app-shell">
    <header class="topbar">
        <a class="brand" href="#/" aria-label="回到 Choice Agent 首页">
            <span class="brand-mark">C</span>
            <span>
                    <strong>Choice Agent V2</strong>
                    <small>通用多 Agent 决策</small>
                </span>
        </a>
        <nav class="nav-links" aria-label="主导航">
            <a href="#/" data-nav="/">首页</a>
            <a href="#/diet/meals/personal" data-nav="/data">我的数据</a>
            <a href="#/admin/traces" data-nav="/admin/traces">Trace</a>
            <a href="#/admin/evaluations" data-nav="/admin/evaluations">评估</a>
        </nav>
        <div class="topbar-actions">
            <div id="themeSwitch" class="theme-switch" aria-label="界面皮肤">
                <button type="button" data-action="set-theme" data-theme-value="mint" aria-pressed="true">清新绿</button>
                <button type="button" data-action="set-theme" data-theme-value="pop" aria-pressed="false">活力橙</button>
            </div>
            <label class="user-field">
                <span>用户 ID</span>
                <input id="userIdInput" type="number" min="1" value="1">
            </label>
        </div>
    </header>

    <main id="app" class="page" tabindex="-1"></main>
</div>

<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script src="./assets/js/api.js"></script>
<script src="./assets/js/demo.js"></script>
<script src="./assets/js/app.js"></script>
</body>
</html>
